name: Stulp
options:
  bundleIdPrefix: com.xinix00
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  Stulp:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: StulpApp
    resources:
      - path: StulpApp/Assets.xcassets
    info:
      path: StulpApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleDisplayName: Stulp
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _matter._tcp
          - _matterc._udp
          - _matterd._udp
        NSLocalNetworkUsageDescription: Stulp gebruikt je lokale netwerk om het nieuwe Matter-apparaat rechtstreeks aan je eigen controller toe te voegen.
        StulpAppGroup: group.com.xinix00.stulp
        StulpKeychainAccessGroup: $(AppIdentifierPrefix)com.xinix00.stulp.shared
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: StulpApp/Stulp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.xinix00.stulp
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.xinix00.stulp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinix00.stulp
        PRODUCT_NAME: Stulp
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: StulpMatterSetup
        embed: true
      - sdk: Matter.framework
      - sdk: MatterSupport.framework
      - sdk: Security.framework

  StulpMatterSetup:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: StulpMatterSetup
    info:
      path: StulpMatterSetup/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleDisplayName: Stulp Matter Setup
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _matter._tcp
          - _matterc._udp
          - _matterd._udp
        NSLocalNetworkUsageDescription: Stulp gebruikt je lokale netwerk om het nieuwe Matter-apparaat rechtstreeks aan je eigen controller toe te voegen.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.matter.support.extension.device-setup
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MatterRequestHandler
        StulpAppGroup: group.com.xinix00.stulp
        StulpKeychainAccessGroup: $(AppIdentifierPrefix)com.xinix00.stulp.shared
    entitlements:
      path: StulpMatterSetup/StulpMatterSetup.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.xinix00.stulp
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.xinix00.stulp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinix00.stulp.MatterSetup
        PRODUCT_NAME: StulpMatterSetup
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: Matter.framework
      - sdk: MatterSupport.framework
      - sdk: Security.framework

  StulpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: StulpTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinix00.stulp.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Security.framework

schemes:
  Stulp:
    build:
      targets:
        Stulp: all
        StulpMatterSetup: all
    test:
      targets:
        - StulpTests
