[package]
name = "stulp-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
stulp-platform = { path = "../platform" }
stulp-protocol = { path = "../protocol" }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
hostnet = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10" }
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.9" }
leantls = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.9" }
# De privésleutel van de server blijft bij Stulp; leantls tekent via Identity.
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "alloc"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
rsa = { version = "=0.9.10", default-features = false, features = ["sha2"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "pkcs8", "zeroize"] }
rand_chacha = { version = "=0.3.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
[lints]
workspace = true
