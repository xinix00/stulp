[package]
name = "stulp-hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
stulp-h2 = { path = "../h2" }
leantls = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12", features = ["mozilla-roots"] }
stulp-core = { path = "../core" }
stulp-controller = { path = "../controller" }
stulp-runtime = { path = "../runtime" }
stulp-protocol = { path = "../protocol" }
stulp-sdk = { path = "../sdk" }
stulp-web = { path = "../web" }
stulp-matter = { path = "../../plugins/matter", default-features = false }
stulp-device-tls = { path = "../device-tls" }
hop-sync = { package = "sync", git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.13" }
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leanhttps = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12", features = ["mozilla-roots"] }
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.13", features = ["http"] }

[dev-dependencies]
stulp-platform = { path = "../platform" }

[lints]
workspace = true
