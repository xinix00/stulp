[package]
name = "stulp-matter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
stulp-plugin-host = { path = "../../crates/plugin-host", optional = true }
stulp-sdk = { path = "../../crates/sdk" }
stulp-core = { path = "../../crates/core" }
stulp-protocol = { path = "../../crates/protocol" }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh", "ecdsa"] }
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.12.4", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
der = { version = "=0.7.10", default-features = false }
subtle = { version = "=2.6.1", default-features = false }

[dev-dependencies]
stulp-runtime = { path = "../../crates/runtime" }
hostnet = { git = "https://github.com/xinix00/hop.git", tag = "v3.0.0-alpha.10" }

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:stulp-plugin-host"]

[[bin]]
name = "stulp-matter"
path = "src/main.rs"
required-features = ["host"]
