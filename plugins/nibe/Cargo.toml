[package]
name = "stulp-nibe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
leancrypto = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
stulp-protocol = { path = "../../crates/protocol" }
stulp-sdk = { path = "../../crates/sdk" }
stulp-core = { path = "../../crates/core" }
stulp-plugin-host = { path = "../../crates/plugin-host", optional = true }

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:stulp-plugin-host"]

[[bin]]
name = "stulp-nibe"
path = "src/main.rs"
required-features = ["host"]

[dev-dependencies]
stulp-runtime = { path = "../../crates/runtime" }
stulp-protocol = { path = "../../crates/protocol" }
stulp-platform = { path = "../../crates/platform" }
